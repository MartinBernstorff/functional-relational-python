source_roots = [
    "packages/functional-relational-python/src",
    "packages/frp-dev/src",
]
forbid_circular_dependencies = true
# Tests are checked like the code next to them: a test imports only from its own
# layer and those below, and only declared dependencies.
exclude = ["**/__pycache__", "**/*egg-info", "docs"]

# Each layer is a package of the library. A layer may import itself and any layer
# below it, never one above.
# shell:        config, catalog loading, file writes, the CLI. The only side effects.
# outputs:      consume a compiled Relation: the in-memory engine and the Python output.
# compiler:     checks a View's pipeline against the Entity graph, giving a Relation.
# pipeline:     the steps users write, and the IR nodes and Relations they build.
# entity_graph: Entities, Ids and the Entity graph.
# support:      identifiers, file paths and generated files, shared by every layer.
layers = ["shell", "outputs", "compiler", "pipeline", "entity_graph", "support"]

# Workspace-level dev dependencies, not dependencies of either package.
[external]
exclude = ["pytest", "hypothesis"]

# `tach check` enforces boundaries between modules within a package. Imports across
# packages (e.g. the published library importing the unpublished frp_dev) are caught
# by `tach check-external`, since each package must declare what it imports.
[[modules]]
path = "frp_dev"
depends_on = []

[[modules]]
path = "functional_relational_python.shell"
layer = "shell"

[[modules]]
path = "functional_relational_python.outputs"
layer = "outputs"

[[modules]]
path = "functional_relational_python.compiler"
layer = "compiler"

[[modules]]
path = "functional_relational_python.pipeline"
layer = "pipeline"

[[modules]]
path = "functional_relational_python.entity_graph"
layer = "entity_graph"

[[modules]]
path = "functional_relational_python.support"
layer = "support"
